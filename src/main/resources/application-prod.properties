#===============================
# ==== JWT Token detail ===========
# ===============================
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS}
app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS}
# ===============================
# = Shareddle TaskExecutor
# ===============================
task.executor.minThreads=${MIN_THREADS}
task.executor.maxThreads=${MAX_THREADS}
task.executor.idleThreadLife=1
#===============================
# ==== Email detail ===========
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=25
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true